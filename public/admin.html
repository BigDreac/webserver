<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
</head>
<body style="background:black;color:white;font-family:monospace">

<h2>Admin Login</h2>
<input type="password" id="password" placeholder="Enter password">
<button onclick="login()">Login</button>

<h2>Connected Users</h2>
<ul id="users"></ul>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function login() {
    const pass = document.getElementById("password").value;
    socket.emit("admin_login", pass);
}

socket.on("admin_success", () => {
    alert("Admin Logged In");
    socket.emit("admin_get_users");
});

socket.on("admin_fail", () => {
    alert("Wrong password");
});

socket.on("admin_user_list", (users) => {
    const list = document.getElementById("users");
    list.innerHTML = "";
    users.forEach(user => {
        const li = document.createElement("li");
        li.innerHTML = user.ip + " <button onclick='kick(\""+user.socketId+"\")'>Kick</button>";
        list.appendChild(li);
    });
});

function kick(id) {
    socket.emit("admin_kick_user", id);
}
</script>

</body>
</html>
