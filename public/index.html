<!DOCTYPE html>
<html>
<head>
    <title>System Console</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #ffffff;
            font-family: Consolas, "Courier New", monospace;
        }

        .console {
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .line {
            margin-bottom: 5px;
        }

        .local {
            color: #00ff00; /* green */
        }

        .remote {
            color: #ffffff; /* white */
        }

        .input-area {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #00ff00;
            margin-right: 5px;
        }

        input {
            flex: 1;
            background: #000;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="console">
    <div class="output" id="output"></div>

    <div class="input-area">
        <span class="prompt">C:\System&gt;</span>
        <input id="input" autocomplete="off" />
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const output = document.getElementById("output");
    const input = document.getElementById("input");

    function addLine(text, type) {
        const div = document.createElement("div");
        div.classList.add("line", type);
        div.textContent = text;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function send() {
        const value = input.value.trim();
        if (value !== "") {
            addLine("C:\\System> " + value, "local"); // show once locally
            socket.emit("update", value);
            input.value = "";
        }
    }

    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            send();
        }
    });

    socket.on("update", function(data) {
        addLine("Remote> " + data, "remote");
    });
</script>

</body>
</html>
