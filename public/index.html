<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Console</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Consolas, "Courier New", monospace;
        }

        .console {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: 15px;
        }

        .output {
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .line {
            margin-bottom: 6px;
        }

        .local {
            color: #00ff00;
        }

        .remote {
            color: #ffffff;
        }

        .system {
            color: #ff4444;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid #222;
        }

        .prompt {
            color: #00ff00;
            white-space: nowrap;
            font-size: clamp(14px, 2vw, 16px);
        }

        input {
            flex: 1;
            background: #000;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: clamp(14px, 2vw, 16px);
            outline: none;
            padding: 5px;
        }

        input:disabled {
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .console {
                padding: 10px;
            }

            .prompt {
                font-size: 14px;
            }

            input {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="console">
    <div class="output" id="output"></div>

    <div class="input-area">
        <span class="prompt">C:\System&gt;</span>
        <input id="input" autocomplete="off" />
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const output = document.getElementById("output");
    const input = document.getElementById("input");

    function addLine(text, type) {
        const div = document.createElement("div");
        div.classList.add("line", type);
        div.textContent = text;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function send() {
        const value = input.value.trim();
        if (value !== "") {
            addLine("C:\\System> " + value, "local");
            socket.emit("update", value);
            input.value = "";
        }
    }

    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            send();
        }
    });

    socket.on("update", function(data) {
        addLine("Remote> " + data, "remote");
    });

    // 🚫 When server is full
    socket.on("limitReached", function(message) {
        addLine(message, "system");
        input.disabled = true;
    });

    window.onload = () => input.focus();
</script>

</body>
</html>
