<!DOCTYPE html>
<html>
<head>
    <title>Live Chat Room</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-box {
            width: 400px;
            height: 500px;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .msg {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 15px;
            max-width: 70%;
        }

        .me {
            background: #4CAF50;
            color: white;
            align-self: flex-end;
        }

        .other {
            background: #ddd;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ccc;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input id="msg" placeholder="Type a message..." />
        <button onclick="send()">Send</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function addMessage(text, className) {
        const div = document.createElement("div");
        div.classList.add("msg", className);
        div.textContent = text;
        document.getElementById("messages").appendChild(div);
        div.scrollIntoView();
    }

    function send() {
        const input = document.getElementById("msg");
        const message = input.value.trim();

        if (message !== "") {
            addMessage(message, "me");   // show instantly on your side
            socket.emit("chat message", message);
            input.value = "";
        }
    }

    socket.on("chat message", function(msg) {
        addMessage(msg, "other");
    });
</script>

</body>
</html>
