<!DOCTYPE html>
<html>
<head>
    <title>Data Sync Panel</title>
    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial;
        }

        .panel {
            width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            background: #2c3e50;
            color: white;
        }

        .feed {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
        }

        .entry {
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            background: #e9ecef;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #2c3e50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">Live Data Feed</div>

    <div class="feed" id="feed"></div>

    <div class="input-area">
        <input id="input" placeholder="Enter value..." />
        <button onclick="send()">Submit</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function send() {
        const input = document.getElementById("input");
        const value = input.value.trim();

        if (value !== "") {
            socket.emit("chat message", value);
            input.value = "";
        }
    }

    socket.on("chat message", function(msg) {
        const div = document.createElement("div");
        div.classList.add("entry");
        div.textContent = msg;
        document.getElementById("feed").appendChild(div);
        div.scrollIntoView();
    });
</script>

</body>
</html>
